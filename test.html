<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Packet Test</title>
</head>
<body>
    <h1>Packet Test Page</h1>
    <p>如果你看到這個頁面，表示伺服器正常運作</p>
    
    <h2>測試步驟：</h2>
    <ol>
        <li>打開瀏覽器開發者工具 (F12)</li>
        <li>前往 Console 標籤</li>
        <li>檢查是否有錯誤訊息</li>
        <li>前往 <a href="http://localhost:4173">http://localhost:4173</a> 查看實際應用</li>
    </ol>
    
    <h2>常見問題：</h2>
    <ul>
        <li><strong>白屏但沒有錯誤</strong> - 可能是 CSS 問題</li>
        <li><strong>Cannot read property of undefined</strong> - 可能是 store 初始化問題</li>
        <li><strong>Module not found</strong> - 可能是導入路徑問題</li>
    </ul>
    
    <script>
        console.log('測試頁面載入成功');
        console.log('請打開 http://localhost:4173 並檢查 Console');
    </script>
</body>
</html>
