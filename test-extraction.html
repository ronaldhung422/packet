<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測試餐廳資訊抓取</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1a1a1a;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #0084e6;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result h2 {
            margin-top: 0;
            color: #1a1a1a;
        }
        .field {
            margin-bottom: 15px;
        }
        .label {
            font-weight: 600;
            color: #666;
            display: block;
            margin-bottom: 5px;
        }
        .value {
            color: #1a1a1a;
            padding: 8px;
            background: white;
            border-radius: 4px;
            min-height: 20px;
        }
        .error {
            color: #e74c3c;
            padding: 15px;
            background: #fee;
            border-radius: 8px;
            margin-top: 15px;
        }
        .loading {
            text-align: center;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍜 餐廳資訊抓取測試</h1>
        <p class="subtitle">測試從 Instagram / Threads 自動抓取餐廳資訊</p>
        
        <input 
            type="text" 
            id="urlInput" 
            placeholder="貼上 Instagram 或 Threads 連結"
            value="https://www.instagram.com/reel/Dc_Ca43KO06/?stkn=MXJ6Z2Z0YWZvaXVzOQ=="
        >
        
        <button onclick="testExtraction()">🔍 抓取資訊</button>
        
        <div id="loading" class="loading" style="display:none;">
            ⏳ 正在抓取資訊...
        </div>
        
        <div id="result" class="result">
            <h2>抓取結果</h2>
            
            <div class="field">
                <span class="label">📱 平台</span>
                <div class="value" id="platform">-</div>
            </div>
            
            <div class="field">
                <span class="label">🏪 餐廳名稱</span>
                <div class="value" id="restaurantName">-</div>
            </div>
            
            <div class="field">
                <span class="label">📍 地址</span>
                <div class="value" id="location">-</div>
            </div>
            
            <div class="field">
                <span class="label">📞 電話</span>
                <div class="value" id="phone">-</div>
            </div>
            
            <div class="field">
                <span class="label">📄 標題</span>
                <div class="value" id="title">-</div>
            </div>
            
            <div class="field">
                <span class="label">📝 描述 (前500字)</span>
                <div class="value" id="description" style="max-height: 200px; overflow-y: auto;">-</div>
            </div>
        </div>
        
        <div id="error" class="error" style="display:none;"></div>
    </div>

    <script>
        async function testExtraction() {
            const url = document.getElementById('urlInput').value.trim();
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const error = document.getElementById('error');
            
            if (!url) {
                alert('請輸入連結');
                return;
            }
            
            result.classList.remove('show');
            error.style.display = 'none';
            loading.style.display = 'block';
            
            try {
                const platform = detectPlatform(url);
                const metadata = await extractClientSide(url, platform);
                
                document.getElementById('platform').textContent = platform;
                document.getElementById('restaurantName').textContent = metadata.restaurantName || '(未找到)';
                document.getElementById('location').textContent = metadata.location || '(未找到)';
                document.getElementById('phone').textContent = metadata.phone || '(未找到)';
                document.getElementById('title').textContent = metadata.title || '(未找到)';
                document.getElementById('description').textContent = (metadata.description || '(未找到)').substring(0, 500);
                
                loading.style.display = 'none';
                result.classList.add('show');
                
            } catch (err) {
                loading.style.display = 'none';
                error.textContent = '❌ 錯誤：' + err.message;
                error.style.display = 'block';
            }
        }
        
        function detectPlatform(url) {
            try {
                const urlObj = new URL(url);
                const hostname = urlObj.hostname.toLowerCase();
                
                if (hostname.includes('instagram.com')) return 'instagram';
                if (hostname.includes('threads.net')) return 'threads';
            } catch {}
            
            return 'manual';
        }
        
        async function extractClientSide(url, platform) {
            try {
                // Use production Vercel API endpoint
                const apiUrl = `https://packet-kappa.vercel.app/api/extract-metadata?url=${encodeURIComponent(url)}`;
                const apiResponse = await fetch(apiUrl);
                
                if (apiResponse.ok) {
                    const data = await apiResponse.json();
                    const text = data.title + ' ' + data.description;
                    
                    return {
                        title: data.title || '',
                        description: data.description || '',
                        image: data.image || '',
                        restaurantName: extractRestaurantName(text),
                        location: extractLocation(text),
                        phone: extractPhone(text),
                        platform
                    };
                }
                
                throw new Error(`API 返回錯誤：${apiResponse.status}`);
                
            } catch (err) {
                throw new Error(`無法抓取網頁內容：${err.message}`);
            }
        }
        
        function parseMetadataFromHtml(html, platform) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            
            const getMeta = (name) => {
                const meta = doc.querySelector(`meta[property="${name}"]`) || doc.querySelector(`meta[name="${name}"]`);
                return meta?.getAttribute('content') || '';
            };
            
            const title = getMeta('og:title') || doc.title;
            const description = getMeta('og:description') || getMeta('description');
            const image = getMeta('og:image');
            
            const text = title + ' ' + description;
            
            return {
                title,
                description,
                image,
                restaurantName: extractRestaurantName(text),
                location: extractLocation(text),
                phone: extractPhone(text),
                platform
            };
        }
        
        function extractRestaurantName(text) {
            const patterns = [
                /[🎉🍜🍕🍣🍔🥘🌮🍰🎂☕️🍱🥟🍲🥘]+\s*([^@\n#]+?)(?:\s+[@#]|\s*$)/,
                /[@#]([a-zA-Z][a-zA-Z0-9._]{2,29})/,
                /(?:lunch|dinner|breakfast|brunch|visited|tried|went to|at)\s+([^@\n.,!?#]{3,40})/i,
                /^([^@\n#]+?)\s*[🍽️🎉⭐🌟✨💫]/,
                /^([^@\n#-]{3,40})(?:\s*[-–—]\s*)/,
                /([\u4e00-\u9fa5]{2,20})/,
                /["""']([^"""'@\n]{3,40})["""']/,
            ];
            
            for (const pattern of patterns) {
                const match = text.match(pattern);
                if (match && match[1]) {
                    let name = match[1].trim();
                    name = name.replace(/[📍🗺️⭐️✨💫🎉]/g, '').trim();
                    name = name.replace(/\s{2,}/g, ' ');
                    
                    if (name.length >= 2 && name.length <= 50 && !isGenericText(name)) {
                        return name;
                    }
                }
            }
            
            return '';
        }
        
        function extractLocation(text) {
            const patterns = [
                /📍\s*([^@\n#]+)/,
                /地址[：:]\s*([^@\n#]+)/,
                /位置[：:]\s*([^@\n#]+)/,
                /(?:address|location)[：:]\s*([^@\n#]+)/i,
                /([九龍|尖沙咀|旺角|油麻地|佐敦|紅磡|觀塘|黃大仙|深水埗|荃灣|沙田|大埔|元朗|屯門|中環|銅鑼灣|灣仔|北角|鰂魚涌|柴灣|筲箕灣|西營盤|上環|金鐘][^@\n#，,。.]+)/,
                /(?:香港島|九龍|新界)[^@\n#，,。.]+/,
                /(?:near|at|in)\s+([A-Za-z\s]+(?:MTR|Station|Road|Street))/i,
                /(?:at|in)\s+([^@\n.,!?]+(?:,\s*[^@\n.,!?]+){1,2})/i,
                /([^@\n]+(?:G\/F|[0-9]+\/F|Shop\s+\d+)[^@\n#，,。.]+)/i,
            ];
            
            for (const pattern of patterns) {
                const match = text.match(pattern);
                if (match && match[1]) {
                    let location = match[1].trim();
                    location = location.replace(/[📍]/g, '').trim();
                    if (location.length > 3 && location.length < 150) {
                        return location;
                    }
                }
            }
            
            return '';
        }
        
        function extractPhone(text) {
            const patterns = [
                /(?:電話|tel|phone|☎️|📞)[：:]\s*([\d\-\s()]+)/i,
                /(?:訂位|預約|聯絡)[：:]\s*([\d\-\s()]+)/i,
                /([569]\d{3}[\s\-]?\d{4})/,
                /([23]\d{3}[\s\-]?\d{4})/,
                /(\+852[\s\-]?[2-9]\d{3}[\s\-]?\d{4})/,
                /(09\d{2}[\s\-]?\d{3}[\s\-]?\d{3})/,
                /(0[2-8][\s\-]?\d{3,4}[\s\-]?\d{4})/,
                /(\d{4}[\s\-]\d{4})/,
            ];
            
            for (const pattern of patterns) {
                const match = text.match(pattern);
                if (match && match[1]) {
                    let phone = match[1].trim();
                    phone = phone.replace(/[\s()]/g, '');
                    if (phone.length >= 8) {
                        return phone;
                    }
                }
            }
            
            return '';
        }
        
        function isGenericText(text) {
            const generic = [
                'instagram', 'threads', 'post', 'photo', 'video', 'story',
                'food', 'yummy', 'delicious', 'tasty', 'good', 'great',
                'lunch', 'dinner', 'breakfast', 'brunch',
                'today', 'yesterday', 'weekend',
                'click', 'link', 'bio', 'check out'
            ];
            const lower = text.toLowerCase();
            return generic.some(word => lower === word || lower.includes(`${word} `) || lower.includes(` ${word}`));
        }
    </script>
</body>
</html>
